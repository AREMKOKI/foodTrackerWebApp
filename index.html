<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f172a">
  <title>Macro Logger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- VIEW 1: DAILY LOG -->
  <section id="view-log" class="view active">
    <header class="sticky-header">
      <div class="header-top">
        <div class="date-nav">
          <button id="prev-day-btn" type="button" class="icon-btn">‹</button>
          <span id="current-date-label">Today</span>
          <button id="next-day-btn" type="button" class="icon-btn">›</button>
        </div>
        <button id="clear-day-btn" type="button" class="danger-outline">Clear Day</button>
      </div>

      <div class="summary-grid">
        <div class="stat-pill primary">
          <span class="stat-val" id="total-cals">0</span>
          <span class="stat-lbl">kcal</span>
        </div>
        <div class="stat-pill">
          <span class="stat-val"><span id="total-protein">0</span>g</span>
          <span class="stat-lbl">Protein</span>
        </div>
        <div class="stat-pill">
          <span class="stat-val"><span id="total-carbs">0</span>g</span>
          <span class="stat-lbl">Carbs</span>
        </div>
        <div class="stat-pill">
          <span class="stat-val"><span id="total-fat">0</span>g</span>
          <span class="stat-lbl">Fat</span>
        </div>
      </div>
    </header>

    <main class="main-wrapper">
      <form id="quick-log-form" class="entry-card">
        <div class="input-group">
          <label>1. Meal</label>
          <div class="meal-selector" id="meal-selector">
            <button type="button" class="meal-btn active" data-meal="Breakfast">Breakfast</button>
            <button type="button" class="meal-btn" data-meal="Lunch">Lunch</button>
            <button type="button" class="meal-btn" data-meal="Dinner">Dinner</button>
            <button type="button" class="meal-btn" data-meal="Snacks">Snacks</button>
          </div>
        </div>

        <div class="input-group search-container">
          <label for="food-search">2. Search Food</label>
          <input 
            type="text" 
            id="food-search" 
            placeholder="Type food (e.g., Chicken, Eggs, Oats)..." 
            autocomplete="off" 
            required
          >
          <div id="search-dropdown" class="search-dropdown hidden"></div>
        </div>

        <div class="input-group">
          <label for="food-grams">3. Weight (grams / ml)</label>
          <input 
            type="number" 
            inputmode="decimal" 
            id="food-grams" 
            placeholder="e.g. 150" 
            min="1" 
            step="1" 
            required
          >
        </div>

        <button type="submit" class="primary-btn">+ Add to Log</button>
      </form>

      <div id="meal-sections-container" class="meal-sections"></div>
    </main>
  </section>

  <!-- VIEW 2: CALENDAR -->
  <section id="view-calendar" class="view hidden">
    <header class="sticky-header">
      <div class="header-top">
        <h1>Calendar</h1>
        <div class="cal-month-nav">
          <button id="prev-month-btn" type="button" class="icon-btn">‹</button>
          <span id="cal-month-label">November 2026</span>
          <button id="next-month-btn" type="button" class="icon-btn">›</button>
        </div>
      </div>
    </header>
    <div class="calendar-wrapper">
      <div class="weekdays-row">
        <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
      </div>
      <div class="calendar-grid" id="calendar-grid"></div>
    </div>
  </section>

  <!-- VIEW 3: STATS -->
  <section id="view-stats" class="view hidden">
    <header class="sticky-header">
      <div class="header-top">
        <h1>Weekly & Monthly</h1>
      </div>
    </header>
    <div class="stats-container">
      <div class="report-card">
        <div class="report-header">
          <h2>This Week</h2>
          <span class="report-range" id="week-range-label">Sun – Sat</span>
        </div>
        <div class="report-grid">
          <div class="report-metric">
            <span class="r-val accent" id="week-total-cals">0</span>
            <span class="r-lbl">Total kcal</span>
          </div>
          <div class="report-metric">
            <span class="r-val" id="week-avg-cals">0</span>
            <span class="r-lbl">Daily Avg</span>
          </div>
          <div class="report-metric">
            <span class="r-val"><span id="week-total-pro">0</span>g</span>
            <span class="r-lbl">Total Protein</span>
          </div>
          <div class="report-metric">
            <span class="r-val"><span id="week-avg-pro">0</span>g</span>
            <span class="r-lbl">Avg Protein/Day</span>
          </div>
        </div>
        <div class="mini-bars" id="week-bars"></div>
      </div>

      <div class="report-card">
        <div class="report-header">
          <h2 id="month-report-title">Monthly Summary</h2>
          <span class="report-range" id="month-days-logged">0 days logged</span>
        </div>
        <div class="report-grid">
          <div class="report-metric">
            <span class="r-val accent" id="month-total-cals">0</span>
            <span class="r-lbl">Total kcal</span>
          </div>
          <div class="report-metric">
            <span class="r-val" id="month-avg-cals">0</span>
            <span class="r-lbl">Daily Avg</span>
          </div>
          <div class="report-metric">
            <span class="r-val"><span id="month-total-pro">0</span>g</span>
            <span class="r-lbl">Total Protein</span>
          </div>
          <div class="report-metric">
            <span class="r-val"><span id="month-total-carbs">0</span>g</span>
            <span class="r-lbl">Total Carbs</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- VIEW 4: ADD FOOD TO BANK (foods.json) -->
  <section id="view-add-food" class="view hidden">
    <header class="sticky-header">
      <div class="header-top">
        <h1>Add Food to Bank</h1>
      </div>
    </header>
    <main class="main-wrapper">
      <form id="add-food-db-form" class="entry-card">
        <div class="input-group">
          <label for="new-food-name">Food Name</label>
          <input type="text" id="new-food-name" placeholder="e.g. Greek Yogurt (Plain)" required>
        </div>

        <div class="input-group">
          <label>Measurement Basis</label>
          <div class="unit-selector" id="new-food-unit-selector">
            <button type="button" class="unit-btn active" data-unit="nutrition-per-100g">Per 100g</button>
            <button type="button" class="unit-btn" data-unit="nutrition-per-100ml">Per 100ml</button>
          </div>
        </div>

        <div class="macro-inputs-grid">
          <div class="input-group">
            <label for="new-food-kcal">Calories (kcal)</label>
            <input type="number" inputmode="decimal" id="new-food-kcal" placeholder="e.g. 120" step="0.1" min="0" required>
          </div>
          <div class="input-group">
            <label for="new-food-protein">Protein (g)</label>
            <input type="number" inputmode="decimal" id="new-food-protein" placeholder="e.g. 10.5" step="0.1" min="0" required>
          </div>
          <div class="input-group">
            <label for="new-food-carbs">Carbs (g)</label>
            <input type="number" inputmode="decimal" id="new-food-carbs" placeholder="e.g. 4.2" step="0.1" min="0" required>
          </div>
          <div class="input-group">
            <label for="new-food-fat">Fat (g)</label>
            <input type="number" inputmode="decimal" id="new-food-fat" placeholder="e.g. 5.0" step="0.1" min="0" required>
          </div>
        </div>

        <div class="input-group">
          <label for="new-food-tags">Tags (comma separated, optional)</label>
          <input type="text" id="new-food-tags" placeholder="e.g. dairy, protein">
        </div>

        <button type="submit" class="primary-btn">Save to foods.json</button>
        <p id="save-food-feedback" class="feedback-msg hidden"></p>
      </form>
    </main>
  </section>



  <!-- BOTTOM NAVIGATION (4 TABS) -->
  <nav class="bottom-nav">
    <button type="button" class="nav-item active" data-target="view-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
    <line x1="9" y1="7" x2="15" y2="7"></line>
    <line x1="9" y1="11" x2="15" y2="11"></line>
  </svg>
      <span>Log</span>
    </button>
    <button type="button" class="nav-item" data-target="view-calendar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
        <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
      <span>Calendar</span>
    </button>
    <button type="button" class="nav-item" data-target="view-stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>Stats</span>
    </button>
    <button type="button" class="nav-item" data-target="view-add-food">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      <span>Add Food</span>
    </button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
